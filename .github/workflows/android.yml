name: Android CI / Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.version.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test release handling
        run: python3 -m unittest discover -s tools/release -v
      - name: Check application and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Polka-Reader-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check VERSION for this event
        id: version
        run: python3 tools/release/publish.py candidate >> "$GITHUB_OUTPUT"

  publish:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.ci.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect tag and existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/publish.py inspect >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.release.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        if: steps.release.outputs.build == 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build signed universal APK
        if: steps.release.outputs.build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Задайте GitHub Actions secrets для подписи: ${missing[*]}"
            exit 1
          fi
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/polka-signing.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew --no-daemon :app:assembleRelease
      - name: Remove temporary keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/polka-signing.keystore"
      - name: Verify APK, upload to draft and publish
        if: success() && steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LC_ALL: C
        run: python3 tools/release/publish.py publish app/build/outputs/apk/release/app-release.apk
